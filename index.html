<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171c2b"><title>Draw Things Prompt Studio</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#101522;color:#f1f3fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:850px;margin:auto;padding:20px}h1{font-size:24px}h2{font-size:18px;margin-top:26px}p,.hint{color:#aeb8cc}section{background:#1c2435;border-radius:16px;padding:15px;margin:12px 0}.chips{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #46516a;background:#27334b;color:white;padding:10px 12px;border-radius:10px;font-size:14px}button.selected{background:#5578ce;border-color:#89a9ff}button.action{background:#5679d7;border:0}textarea{box-sizing:border-box;width:100%;min-height:185px;border-radius:12px;background:#0e1421;border:1px solid #46516a;color:#fff;padding:12px;font-size:13px;line-height:1.6}label{display:block;margin:8px 0}select,input{background:#27334b;color:#fff;padding:9px;border:1px solid #46516a;border-radius:8px;max-width:100%}.buttons{display:flex;gap:8px;flex-wrap:wrap}small{color:#aeb8cc}</style></head><body><main><h1>✦ Draw Things Prompt Studio</h1><p>Counterfeit V3.0向け・日本語で選ぶプロンプト辞典。端末内で動作します。</p><section><label>画風 <select id="style"><option value="water">淡い水彩・透明感</option><option value="anime">アニメ塗り</option><option value="visual">美少女ゲーム風</option><option value="none">画風指定なし</option></select></label><label><input type="checkbox" id="quality" checked> 品質タグを追加</label><label><input type="checkbox" id="negative" checked> ネガティブの基本タグを追加</label></section><div id="categories"></div><section><h2>追加のポジティブ指定</h2><textarea id="custom" placeholder="例: red ribbon, white blouse"></textarea></section><section><h2>ポジティブプロンプト</h2><textarea id="positiveOut" spellcheck="false"></textarea><div class="buttons"><button class="action" data-copy="positiveOut">コピー</button><button data-save="positiveOut">TXT保存</button></div></section><section><h2>ネガティブプロンプト</h2><textarea id="negativeOut" spellcheck="false"></textarea><div class="buttons"><button class="action" data-copy="negativeOut">コピー</button><button data-save="negativeOut">TXT保存</button></div></section><section><div class="buttons"><button id="reset">選択をリセット</button><button id="export">設定をJSON保存</button><label>設定を読み込む <input id="import" type="file" accept="application/json,.json"></label></div><small>選択内容はブラウザ内に自動保存されます。公開リポジトリに個人情報を書き込まないでください。</small></section></main><script>
const categories={"人物・構図":[["女性1人","1girl"],["男性1人","1boy"],["成人女性","adult woman"],["成人男性","adult man"],["単独","solo"],["全身","full body"],["頭から足先","head to toe"],["上半身","upper body"],["正面","front view"],["横顔","profile"],["後ろ姿","from behind"]],"髪色":[["銀髪","silver hair"],["白髪","white hair"],["黒髪","black hair"],["茶髪","brown hair"],["金髪","blonde hair"],["赤髪","red hair"],["青髪","blue hair"],["ピンク髪","pink hair"],["紫髪","purple hair"],["緑髪","green hair"],["グラデーション","gradient hair"],["毛先別色","colored hair tips"]],"髪型":[["ショート","short hair"],["ボブ","bob cut"],["ミディアム","medium hair"],["ロング","long hair"],["超ロング","very long hair"],["ストレート","straight hair"],["ウェーブ","wavy hair"],["ポニーテール","ponytail"],["ツインテール","twintails"],["三つ編み","braid"],["お団子","hair bun"],["ぱっつん","blunt bangs"],["斜め前髪","swept bangs"],["アホ毛","ahoge"]],"目・顔":[["青い瞳","blue eyes"],["赤い瞳","red eyes"],["緑の瞳","green eyes"],["金の瞳","golden eyes"],["紫の瞳","purple eyes"],["茶色の瞳","brown eyes"],["オッドアイ","heterochromia"],["ジト目","jitome"],["つり目","tsurime"],["たれ目","tareme"],["大きな目","large eyes"],["繊細な顔","delicate facial features"]],"表情":[["微笑み","slight smile"],["笑顔","smile"],["無表情","expressionless"],["照れ","blush"],["怒り","angry"],["悲しみ","sad"],["驚き","surprised"],["ニヤリ","smirk"],["悪戯っぽい","mischievous smile"],["ウインク","wink"],["真剣","serious"]],"体型":[["小柄","petite"],["高身長","tall"],["細身","slender"],["華奢","delicate build"],["標準体型","average build"],["筋肉質","muscular"],["引き締まった","toned body"],["自然な比率","natural proportions"],["色白","fair skin"],["褐色肌","dark skin"]],"服装":[["制服","school uniform"],["セーラー服","serafuku"],["ブレザー","blazer"],["シャツ","collared shirt"],["Tシャツ","t-shirt"],["パーカー","hoodie"],["ジャージ","tracksuit"],["ドレス","dress"],["ゴシックドレス","gothic dress"],["メイド服","maid outfit"],["ワンピース","one-piece dress"],["スカート","skirt"],["プリーツスカート","pleated skirt"],["ショートパンツ","shorts"],["ジーンズ","jeans"],["タイツ","pantyhose"],["ニーソックス","kneehighs"],["ルーズソックス","loose socks"],["ブーツ","boots"],["ローファー","loafers"]],"ポーズ":[["立つ","standing"],["座る","sitting"],["歩く","walking"],["走る","running"],["しゃがむ","squatting"],["膝立ち","kneeling"],["腕組み","crossed arms"],["腰に手","hand on hip"],["手を振る","waving"],["振り返る","looking back"],["首を傾ける","head tilt"],["こちらを見る","looking at viewer"]],"背景・光":[["白背景","white background"],["淡い背景","pale background"],["シンプル背景","simple background"],["教室","classroom"],["森","forest"],["街","city street"],["夕焼け","sunset"],["自然光","natural lighting"],["柔らかな光","soft lighting"],["逆光","backlighting"],["暖色の光","warm lighting"]]};
const styles={water:['(soft watercolor painting:1.3)','(watercolor shading:1.3)','(translucent coloring:1.2)','(soft color gradients:1.2)','(delicate thin lineart:1.2)','soft anime illustration','natural skin tones','gentle highlights'],anime:['anime illustration','clean lineart','cel shading','vibrant colors'],visual:['visual novel character art','delicate lineart','soft gradients','refined anime aesthetics'],none:[]};
const negBase='(worst quality:1.3), (low quality:1.3), lowres, jpeg artifacts, bad anatomy, bad proportions, malformed hands, extra fingers, missing fingers, fused fingers, extra arms, extra legs, deformed face, cropped, out of frame, text, watermark, signature';const negWater='thick outlines, bold black lineart, harsh cel shading, hard shadows, oversaturated colors, neon colors, plastic skin, 3d render, photorealistic';
const $=id=>document.getElementById(id);let state={selected:['1girl','solo','adult woman','full body','head to toe','standing','silver hair','long hair','blue eyes','dress','simple background'],style:'water',quality:true,negative:true,custom:'',posEdit:null,negEdit:null};try{Object.assign(state,JSON.parse(localStorage.getItem('drawthings-studio-v2')||'{}'))}catch(e){};
function render(){const root=$('categories');root.replaceChildren();for(const [name,items] of Object.entries(categories)){const sec=document.createElement('section'),heading=document.createElement('h2'),wrap=document.createElement('div');heading.textContent=name;wrap.className='chips';for(const [ja,en] of items){const b=document.createElement('button');b.textContent=ja;b.className=state.selected.includes(en)?'selected':'';b.onclick=()=>{state.selected=state.selected.includes(en)?state.selected.filter(x=>x!==en):[...state.selected,en];state.posEdit=null;update();render()};wrap.append(b)}sec.append(heading,wrap);root.append(sec)}$('style').value=state.style;$('quality').checked=state.quality;$('negative').checked=state.negative;$('custom').value=state.custom;update()}
function update(){const base=[...(state.quality?['masterpiece','best quality']:[]),...state.selected,...styles[state.style],...state.custom.split(',').map(x=>x.trim()).filter(Boolean)].filter((x,i,a)=>a.indexOf(x)===i);$('positiveOut').value=state.posEdit??base.join(',\n');$('negativeOut').value=state.negEdit??(state.negative?[negBase,...(state.style==='water'?[negWater]:[])].join(',\n'):'');try{localStorage.setItem('drawthings-studio-v2',JSON.stringify(state))}catch(e){}}
for(const [id,key] of [['style','style'],['quality','quality'],['negative','negative'],['custom','custom']])$(id).addEventListener('input',e=>{state[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;state.posEdit=null;state.negEdit=null;update()});$('positiveOut').oninput=e=>{state.posEdit=e.target.value;update()};$('negativeOut').oninput=e=>{state.negEdit=e.target.value;update()};
function download(name,content,type='text/plain'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const v=$(b.dataset.copy).value;try{await navigator.clipboard.writeText(v);b.textContent='コピーしました'}catch(e){$(b.dataset.copy).select();document.execCommand('copy');b.textContent='選択してコピー'}setTimeout(()=>b.textContent='コピー',1800)});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>download(b.dataset.save+'.txt',$(b.dataset.save).value));$('reset').onclick=()=>{if(confirm('選択をリセットしますか？')){state={selected:[],style:'water',quality:true,negative:true,custom:'',posEdit:null,negEdit:null};render()}};$('export').onclick=()=>download('drawthings-settings.json',JSON.stringify(state,null,2),'application/json');$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.selected))throw Error('invalid');Object.assign(state,obj);render()}catch(err){alert('JSONを読み込めませんでした')}};if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
